<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nina.craft 登入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-600: #5da344;
    --green-700: #3f6b3a;
    --green-800: #2e4f2b;
    --teal-500: #4f96a0;
    --text-dark: #2c3527;
    --text-grey: #a7b39c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text-dark);
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f8faf4;
    background-image: url('assets/img/login-bg.jpg');
    background-repeat: no-repeat;
    background-position: top center;
    background-size: 100% auto;
    padding: 40px 16px;
  }

  /* --- login card --- */
  .login-card {
    position: relative;
    z-index: 1;
    width: 420px;
    max-width: 100%;
    padding: clamp(32px, 7vw, 52px) clamp(24px, 6vw, 40px) clamp(28px, 6vw, 40px);
    border-radius: 32px;
    background: linear-gradient(165deg, #e2f0cd 0%, #b9dc95 55%, #8ac768 100%);
    box-shadow:
      0 24px 60px rgba(63, 107, 58, 0.28),
      0 4px 14px rgba(63, 107, 58, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- logo badge --- */
  .logo-badge {
    width: clamp(110px, 26vw, 148px);
    height: clamp(110px, 26vw, 148px);
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(63, 107, 58, 0.25), inset 0 0 0 4px rgba(250, 246, 234, 0.7);
    flex-shrink: 0;
  }
  .logo-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* --- brand title --- */
  .brand-title {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(32px, 8vw, 46px);
    margin: clamp(16px, 4vw, 22px) 0 clamp(20px, 5vw, 30px);
    background: linear-gradient(90deg, var(--teal-500) 0%, var(--green-600) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    line-height: 1;
  }

  .login-btn {
    margin-top: 10px;
    width: 100%;
    border: none;
    cursor: pointer;
    padding: 16px 0;
    border-radius: 999px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 10px;
    color: var(--green-800);
    background: linear-gradient(180deg, #b7e496 0%, #7cbd5a 100%);
    box-shadow: 0 10px 22px rgba(63, 107, 58, 0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .login-btn:hover {
    filter: brightness(1.04);
    transform: translateY(-1px);
    box-shadow: 0 14px 26px rgba(63, 107, 58, 0.4), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .login-btn:active {
    transform: translateY(0);
  }

  @media (max-width: 380px) {
    .login-card { border-radius: 26px; }
    .login-btn { letter-spacing: 6px; }
  }
</style>
</head>
<body>

  <div class="login-card">
    <div class="logo-badge">
      <img src="assets/img/logo.jpg" alt="Nina.craft Handmade Creations">
    </div>

    <h1 class="brand-title">Nina.<span>&#8202;_&#8202;</span>.craft</h1>

    <p id="login-error" style="display:none; color:#b23a2f; font-size:13px; margin:0 0 16px; text-align:center;"></p>

    <button type="button" class="login-btn" id="login-btn">使用 GitHub 登入</button>
  </div>

  <script type="module">
    import { getGithubLoginUrl, loginWithCode } from './js/auth.js';

    const errorEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    btn.addEventListener('click', () => {
      location.href = getGithubLoginUrl();
    });

    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      btn.disabled = true;
      btn.textContent = '登入中...';
      loginWithCode(code)
        .then(() => {
          location.href = 'index.html';
        })
        .catch((err) => {
          showError(err.message);
          btn.disabled = false;
          btn.textContent = '使用 GitHub 登入';
          history.replaceState(null, '', location.pathname);
        });
    }
  </script>
</body>
</html>
